[package]
name = "aether_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "aether_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
rayon = "1.10"
regex = "1.10"
base64 = "0.22"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
